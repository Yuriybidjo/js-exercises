<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>form</title>
    <script src="./script.js" defer></script>
    <link rel="stylesheet" href="./style.css">
  </head>
  <body>
    <div class="color-box boxes">
      <form>
        <h2>Select background Color</h2>
        <div>
          <label
            >Red<input type="radio" value="red" name="color" id="red"
          /></label>
        </div>
        <div>
          <label
            >Green<input type="radio" value="green" name="color" id="green"
          /></label>
        </div>
        <div>
          <label
            >Blue<input type="radio" value="blue" name="color" id="blue"
          /></label>
        </div>
      </form>
    </div>

    <div class="hobby-box boxes">
      <form id="hobby">
        <h2>Select Your Hobby</h2>
        <div>
          <label
            >HTML<input type="checkbox" value="html" name="hobby" id="html"
          /></label>
        </div>
        <div>
          <label
            >CSS<input type="checkbox" value="css" name="hobby" id="css"
          /></label>
        </div>
        <div>
          <label
            >JS<input type="checkbox" value="js" name="hobby" id="js"
          /></label>
        </div>
      </form>

      <p id="output-result">Output</p>
    </div>
  </body>
</html>
